<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理 - 媽媽的健康日記</title>

<!-- 讓網頁以 App 模式(全螢幕)執行，隱藏網址列 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- 設定手機頂部狀態列的顏色 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121418">
    
    <!-- 設定加入主畫面時的 App 名稱 -->
    <meta name="apple-mobile-web-app-title" content="健康日記">
    
    <!-- 載入 App 設定檔 -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #f4f7f5;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #777777;
            --primary: #7a945b; 
            --primary-hover: #637a48;
            --accent: #e6aa7a; 
            --danger: #e07a7a;
            --border: #dcdcdc;
            
            --tag-food: #7ab1e0;
            --tag-medical: #e07a7a;
            --tag-status: #e3b341;
            --tag-error: #ff4d4f; /* 新增：錯誤標籤專用紅色 */
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 85vh; }
        .login-box { background: var(--panel-bg); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        .login-box h2 { color: var(--primary); margin-top: 0; margin-bottom: 10px; }
        .login-box p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        
        input[type="password"] { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid var(--border); background: #fafafa; color: var(--text-color); font-size: 1.1rem; outline: none; box-sizing: border-box; }
        input[type="password"]:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(122, 148, 91, 0.3); }
        
        button { background: var(--primary); color: white; border: none; padding: 15px 20px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: var(--primary-hover); }

        #dashboard-screen { display: none; max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { margin: 0; color: var(--primary); }
        .header-actions { display: flex; gap: 10px; }
        .header-actions button { width: auto; padding: 10px 20px; font-size: 1rem; }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-outline:hover { background: #f0f0f0; color: var(--text-color); }

        .table-container { background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 5px 15px rgba(0,0,0,0.03); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        th { background: rgba(122, 148, 91, 0.1); color: var(--primary); font-weight: 600; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #fdfdfd; }
        
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: inline-block; white-space: nowrap; }
        .tag.food { background: rgba(122, 177, 224, 0.15); color: var(--tag-food); border: 1px solid var(--tag-food); }
        .tag.medical { background: rgba(224, 122, 122, 0.15); color: var(--tag-medical); border: 1px solid var(--tag-medical); }
        .tag.status { background: rgba(227, 179, 65, 0.15); color: var(--tag-status); border: 1px solid var(--tag-status); }
        .tag.error { background: rgba(255, 77, 79, 0.15); color: var(--tag-error); border: 1px solid var(--tag-error); } /* 新增：錯誤樣式 */

        .date-text { font-weight: bold; color: var(--text-color); }
        .time-text { color: var(--accent); font-size: 0.9rem; }
        .period-text { color: var(--text-muted); font-size: 0.9rem; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>🪴 系統管理員登入</h2>
            <p>請輸入後台密碼以查看健康數據明細</p>
            <input type="password" id="admin-pwd" placeholder="請輸入密碼" onkeypress="handleEnter(event)">
            <button onclick="checkLogin()">登入查看</button>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="header">
            <h2>媽媽的健康數據總覽</h2>
            <div class="header-actions">
                <button onclick="fetchData()">🔄 重新整理</button>
                <button class="btn-outline" onclick="logout()">登出</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>記錄日期與時間</th>
                        <th>記錄類別</th>
                        <th>項目</th>
                        <th>詳細內容 / 劑量 / 症狀</th>
                    </tr>
                </thead>
                <tbody id="data-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        function handleEnter(e) { if (e.key === 'Enter') checkLogin(); }

        function checkLogin() {
            const pwd = document.getElementById('admin-pwd').value;
            if (pwd === '15211521') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                fetchData(); 
            } else { alert('密碼錯誤！請重新輸入。'); }
        }

        function logout() {
            document.getElementById('admin-pwd').value = '';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        const catMap = {
            'food': { label: '飲食紀錄', class: 'food' },
            'medical': { label: '醫療紀錄', class: 'medical' },
            'status': { label: '身體狀況', class: 'status' },
            'error': { label: '系統報錯', class: 'error' } // 新增：錯誤分類
        };

        async function fetchData() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 30px; color: #777;">資料載入中...</td></tr>';
            
            const N8N_GET_URL = 'https://orthodox-oarfish.pikapod.net/webhook/get-health-records';

            try {
                const response = await fetch(N8N_GET_URL);
                if (!response.ok) throw new Error("網路連線異常");
                const data = await response.json();

                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #777;">目前還沒有任何紀錄</td></tr>';
                    return;
                }

                data.sort((a, b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));

                data.forEach(row => {
                    const catInfo = catMap[row.category] || { label: '未分類', class: 'status' };
                    const periodHtml = row.period ? `<span class="period-text">[${row.period}]</span>` : '';
                    // 如果是錯誤，把內容文字加粗標紅以便識別
                    const contentHtml = row.category === 'error' ? `<span style="color: #ff4d4f; font-weight: bold;">${row.content}</span>` : row.content;
                    
                    tbody.innerHTML += `
                        <tr style="${row.category === 'error' ? 'background: #fff1f0;' : ''}">
                            <td>
                                <div class="date-text">${row.date}</div>
                                <div class="time-text">${row.time} ${periodHtml}</div>
                            </td>
                            <td><span class="tag ${catInfo.class}">${catInfo.label}</span></td>
                            <td><strong>${row.type}</strong></td>
                            <td>${contentHtml}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">資料載入失敗，請檢查 API 網址</td></tr>';
            }
        }
    </script>
</body>
</html>
