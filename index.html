<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>媽媽的健康日記 V2 (2.5D 遊戲版)</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121418">
    <meta name="apple-mobile-web-app-title" content="健康日記">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* =========================================
           亮色系主題變數 (Light Mode)
           ========================================= */
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #00bcd4;
            --primary-glow: rgba(0, 188, 212, 0.4);
            --accent: #2980b9; 
            --danger: #e74c3c;
            --warning: #f39c12;
            --border: rgba(0, 0, 0, 0.08);
            
            --tag-food: #7ab1e0;
            --tag-status: #e3b341;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 鎖定主畫面，避免任何滑動 */
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; touch-action: none; }

        /* =========================================
           1. 2.5D 等距視角 (Isometric) 復古農場
           ========================================= */
        #garden-world {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; display: flex; flex-direction: column; overflow: hidden;
            background-color: #000;
        }
        
        /* 天空層改為 100% 高度 */
        #garden-sky {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            transition: background 2s; z-index: 1;
        }
        .sky-day { background: linear-gradient(to bottom, #74c7ff 0%, #c8ebff 40%, #c8ebff 100%); }
        .sky-night { background: linear-gradient(to bottom, #101828 0%, #1a2a42 40%, #1a2a42 100%); }
        
        .celestial-body {
            position: absolute; 
            top: 5%;  
            left: 8%; 
            font-size: 3.5rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
            animation: floatUp 3s ease-in-out infinite alternate; z-index: 2;
        }
        
        .star { 
            position: absolute; color: #FFF; font-size: 1rem; 
            animation: twinkle 1.5s ease-in-out infinite alternate; z-index: 1; 
        }

        /* =========================================
           動畫關鍵影格
           ========================================= */
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.05); } 
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* =========================================
           夜空流星特效
           ========================================= */
        @keyframes shootAcross {
            0% { transform: rotate(var(--star-angle, 20deg)) translateX(-10vw) scale(0.5); opacity: 0; }
            2% { opacity: 1; transform: rotate(var(--star-angle, 20deg)) translateX(0vw) scale(1); } 
            12% { transform: rotate(var(--star-angle, 20deg)) translateX(60vw) scale(0.2); opacity: 0; } 
            100% { transform: rotate(var(--star-angle, 20deg)) translateX(60vw); opacity: 0; } 
        }
        
        .shooting-star {
            position: absolute;
            left: var(--star-start-x, 0%);
            top: var(--star-start-y, 0%);
            width: 100px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
            border-radius: 50%;
            filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px rgba(0, 229, 255, 0.5)); 
            animation: shootAcross 25s infinite linear;
            z-index: 1; 
            opacity: 0; 
        }

        /* =========================================
           天空飄雲特效
           ========================================= */
        @keyframes floatCloud {
            0% { transform: translateX(120vw); }
            100% { transform: translateX(-30vw); }
        }
        
        .cloud {
            position: absolute;
            filter: drop-shadow(0 5px 15px rgba(255,255,255,0.4));
            animation: floatCloud linear infinite;
            z-index: 3; 
            opacity: 0.85;
        }

        /* =========================================
           即時天氣系統 (雨天特效)
           ========================================= */
        #weather-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 15; 
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.6));
            width: 2px; height: 35px; 
            border-radius: 2px;
            animation: rainFall linear infinite;
            opacity: 0; 
        }

        @keyframes rainFall {
            0% { transform: translateY(-50px) rotate(15deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(120vh) translateX(-30vh) rotate(15deg); opacity: 0; }
        }

        /* =========================================
           微風擺動動畫
           ========================================= */
        @keyframes windBreeze {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .swaying-plant {
            display: inline-block; 
            animation: windBreeze 7s ease-in-out infinite; 
            transform-origin: bottom center; 
        }

        /* =========================================
           原野微風與昆蟲飛行特效
           ========================================= */
        @keyframes flyAcross {
            0% { transform: translateX(-20vw) translateY(0px); }
            25% { transform: translateX(30vw) translateY(-40px); }
            50% { transform: translateX(60vw) translateY(30px); }
            75% { transform: translateX(90vw) translateY(-30px); }
            100% { transform: translateX(120vw) translateY(0px); }
        }
        @keyframes flyAcrossReverse {
            0% { transform: scaleX(-1) translateX(-20vw) translateY(0px); }
            25% { transform: scaleX(-1) translateX(30vw) translateY(35px); }
            50% { transform: scaleX(-1) translateX(60vw) translateY(-25px); }
            75% { transform: scaleX(-1) translateX(90vw) translateY(40px); }
            100% { transform: scaleX(-1) translateX(120vw) translateY(0px); }
        }

        .flying-insect {
            position: absolute;
            font-size: 0.5rem; 
            z-index: 60; 
            filter: drop-shadow(0 15px 5px rgba(0,0,0,0.3));
            animation: flyAcross 20s linear infinite;
            top: var(--bug-start-y, 50%);
            left: 0;
            will-change: transform;
        }
        .fly-reverse {
            animation: flyAcrossReverse 25s linear infinite;
            right: 0; left: auto;
        }

        /* =========================================
           地平線與天空比例調整 (無限大地平線)
           ========================================= */
        #garden-floor-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1200px; overflow: hidden; z-index: 10;
            -webkit-mask-image: radial-gradient(ellipse 150% 120% at 50% 115%, black 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 150% 120% at 50% 115%, black 55%, transparent 100%);
        }

       
        /* 🌟 草地與網格 (回歸完美的 350vw 置中，top 往下壓讓出天空) 🌟 */
        #garden-floor {
            position: absolute; 
            width: 350vw; height: 350vw; 
            top: -30vh; left: -125vw; /* 完美的 1:1 置中比例 */
            border-radius: 45%; 
            background-color: #8cc474; 
            background-image: 
                linear-gradient(rgba(255,255,255,0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 2px, transparent 2px),
                radial-gradient(circle at 10px 10px, rgba(0,0,0,0.03) 2px, transparent 3px);
            background-size: 5% 5%, 5% 5%, 30px 30px; 
            transform: rotateX(72deg) rotateZ(45deg);
            transform-style: preserve-3d;
        }

        /* 中間 4 格專用的「肥沃泥土」 (完美對齊 5% 網格) */
        .farm-plot {
            position: absolute; width: 5%; height: 5%; 
            background-color: #795548; border: 2px solid #5D4037; box-sizing: border-box;
            border-radius: 4px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* 花草植物通用設定 */
        .garden-item {
            position: absolute; 
            transform-origin: bottom center; 
            transform: rotateZ(-45deg) rotateX(-72deg);
            transition: all 0.5s;
            text-shadow: -1px 4px 10px rgba(0,0,0,0.04);
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        .grass-tuft { font-size: 1.2rem; opacity: 0.7; filter: none; }
        
        /* 左側大樹固定位 */
        .big-tree-25d {
            font-size: 9rem;
            transform-origin: bottom center;
            transform: rotateZ(-45deg) rotateX(-72deg); /* 修正拼字錯誤 */
            text-shadow: 0px 5px 20px rgba(0,0,0,0.02);
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* =========================================
           2. 遊戲主 UI (右側飄浮按鈕)
           ========================================= */
        .game-sidebar {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 20;
        }
        
        .game-btn {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 8px 16px rgba(0, 0, 0, 0.2), 
                inset 0 4px 5px rgba(255, 255, 255, 0.5), 
                inset 0 -4px 5px rgba(0, 0, 0, 0.05);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .game-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }
        .game-btn:active { transform: scale(0.92); box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3), inset 0 2px 5px rgba(0, 0, 0, 0.2); }

        /* =========================================
           3. 各功能視窗 (高質感亮色毛玻璃)
           ========================================= */
        .overlay-page {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.75); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            z-index: 40; display: none; overflow-y: auto; padding: 20px; padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
        }
        .overlay-page.active { display: block; }
        
        .back-to-game-btn {
            position: sticky; top: 0; z-index: 50; display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255, 255, 255, 0.9); color: var(--danger); border: 1px solid rgba(231, 76, 60, 0.3);
            padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; margin-bottom: 20px;
        }

        .section-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--accent); font-weight: bold; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .grid-full { grid-column: span 2; } 
        .grid-full-3 { grid-column: span 3; }
        
        button.record-btn { background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border); border-radius: 12px; padding: 14px 5px; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .icon { font-size: 1.5rem; margin-bottom: 5px; }

        /* 盆栽畫面 */
        .game-container { text-align: center; background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .pot-scene { position: relative; width: 100%; height: 220px; background: linear-gradient(to bottom, #a1dffb, #e6f7ff 50%, #a2d28f 50%, #68a34f 100%); border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1); cursor: pointer; }
        .soil-patch { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 40px; background: #795548; border-radius: 50%; box-shadow: inset 0 5px 10px rgba(0,0,0,0.4); }
        .plant-avatar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 5rem; animation: breath 3s infinite ease-in-out; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        @keyframes breath { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05) translateY(-5px); } }
        .progress-bar { width: 100%; height: 20px; background: rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid var(--border); }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00bcd4, #3498db); transition: width 0.5s; }
        .stage-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

        /* 行事曆 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; color: var(--text-color); font-size: 1.2rem; font-weight: bold; background: var(--panel-bg); border-radius: 12px 12px 0 0; }
        .calendar-nav-btn { background: transparent; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 10px; background: var(--panel-bg); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 10px 20px 10px; background: var(--panel-bg); border-radius: 0 0 12px 12px; }
        .day-cell { min-height: 70px; background: rgba(0, 0, 0, 0.03); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; align-items: center; padding-top: 6px; color: var(--text-color); cursor: pointer; }
        .day-cell.today { background: rgba(0, 188, 212, 0.1); border: 1px solid var(--primary); font-weight: bold; }
        .day-cell.empty { background: transparent; border: none; }
        .record-icons { display: flex; gap: 2px; margin-top: auto; padding-bottom: 5px; flex-wrap: wrap; justify-content: center; font-size: 0.8rem; }
        
        /* =========================================
           4. 內部小彈窗 (新增紀錄、明細)
           ========================================= */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--bg-color); padding: 20px; border-radius: 16px; width: 92%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { font-size: 1.2rem; color: var(--accent); font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .time-picker, .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text-color); font-size: 1.1rem; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); }
        .time-selector { display: none; gap: 8px; margin-bottom: 15px; }
        .time-btn { flex: 1; padding: 10px 0; background: #fff; border: 1px solid var(--border); color: var(--text-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .time-btn.selected { background: var(--primary); color: #fff; font-weight: bold; border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
        .submit-btn { background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; box-shadow: 0 4px 10px var(--primary-glow); cursor: pointer;}
        .close-btn { background: #fff; color: var(--text-muted); border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer;}

        /* 歷史明細 */
        .history-container { margin-bottom: 15px; display: none; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; border-left: 3px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .edit-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;}
        .detail-group { background: #fff; border-radius: 8px; margin-bottom: 12px; padding: 12px; border-left: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .detail-group.danger { border-left-color: var(--danger); }
        .detail-group.warning { border-left-color: var(--warning); }
        .detail-time-title { font-size: 0.9rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .detail-group.danger .detail-time-title { color: var(--danger); }
        .detail-group.warning .detail-time-title { color: var(--warning); }
        .detail-item { font-size: 0.95rem; margin: 8px 0 0 0; color: var(--text-color); display: flex; justify-content: space-between; align-items: flex-start; }
        .detail-item span.tag { font-size: 0.75rem; background: #f0f4f8; padding: 3px 8px; border-radius: 6px; color: var(--text-muted); margin-left: 10px; white-space: nowrap;}

        /* 自訂成功提示彈窗樣式 */
        @keyframes pop-bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-5px); } }
        .seed-animation { font-size: 4.5rem; margin: 15px auto; animation: pop-bounce 2s infinite ease-in-out; display: flex; justify-content: center; }

    </style>
</head>
<body>

    <!-- 第一層：全螢幕 2.5D 花園 -->
    <div id="garden-world">
        <div id="garden-sky"></div>
        <div id="garden-floor"></div>
    </div>

    <!-- 第二層：遊戲右側浮動按鈕 -->
    <div class="game-sidebar">
        <div class="game-btn" id="bgm-toggle-btn" onclick="toggleBgm()" style="width: 38px; height: 38px; font-size: 1rem; align-self: flex-end; margin-right: 5px; margin-bottom: 5px; box-shadow: none; border: 1px solid rgba(255,255,255,0.4);">🔇</div>
        <div class="game-btn" onclick="openRecordPage()">📝</div>
        <div class="game-btn" onclick="openOverlay('page-plant')">🪴</div>
        <div class="game-btn" onclick="openOverlay('page-calendar')">📅</div>
    </div>

    <!-- 第三層：遊戲功能視窗 -->
    
    <!-- 紀錄視窗 -->
    <div id="page-record" class="overlay-page">
        <div class="back-to-game-btn" onclick="closeOverlay('page-record')">返回花園</div>
        
        <div class="section-title" id="record-page-title-food">🍽️ 飲食與喝水 (今日)</div>
        <div class="grid-3">
            <button class="record-btn" onclick="openInputModal('早餐', 'food')"><span class="icon">🥪</span>早餐</button>
            <button class="record-btn" onclick="openInputModal('午餐', 'food')"><span class="icon">🍱</span>午餐</button>
            <button class="record-btn" onclick="openInputModal('晚餐', 'food')"><span class="icon">🍲</span>晚餐</button>
            <button class="record-btn" onclick="openInputModal('點心', 'food')"><span class="icon">🍎</span>點心</button>
            <button class="record-btn" onclick="openInputModal('喝水', 'water')" style="border-bottom: 3px solid #3498db;"><span class="icon">💧</span>喝水</button>
        </div>
        
        <div class="section-title" id="record-page-title-med">🏥 醫療與身體活動 (今日)</div>
        <div class="grid-3">
            <button class="record-btn" onclick="openInputModal('胰島素', 'medical')" style="border-bottom: 3px solid var(--danger);"><span class="icon">💉</span>胰島素</button>
            <button class="record-btn" onclick="openInputModal('吃藥', 'medical')" style="border-bottom: 3px solid var(--primary);"><span class="icon">💊</span>吃藥</button>
            <button class="record-btn" onclick="openInputModal('步數', 'steps')" style="border-bottom: 3px solid #2ecc71;"><span class="icon">👣</span>步數</button>
            <button class="record-btn grid-full-3" onclick="openInputModal('身體狀況', 'status')" style="border-bottom: 3px solid var(--warning);"><span class="icon">🤒</span>身體狀況紀錄</button>
        </div>
    </div>

    <!-- 盆栽視窗 -->
    <div id="page-plant" class="overlay-page">
        <div class="back-to-game-btn" onclick="closeOverlay('page-plant')">返回花園</div>
        <div class="game-container">
            <h2 id="month-garden-title" style="margin-top:0; color:var(--accent);">生長區動態</h2>
            
            <div id="cycle-hint" style="font-size: 0.85rem; color: var(--primary); margin-bottom: 8px; font-weight: bold; display: none;">
                👇 點擊下方盆栽，切換查看其他植物進度
            </div>
            
            <div class="pot-scene" onclick="cyclePlantStatus()">
                <div class="soil-patch"></div>
                <div class="plant-avatar" id="plant-avatar">💤</div>
            </div>
            
            <h3 id="plant-stage-text">生長區目前休息中</h3>
