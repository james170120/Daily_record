<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>漂浮群島花園</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #7ec8e3 0%, #d8f3ff 100%);
      transition: background 0.8s ease;
    }
    body.night { background: linear-gradient(180deg, #090d16 0%, #172554 58%, #1e293b 100%); }
    body.raining { background: linear-gradient(180deg, #8a9aa8 0%, #c3cdd6 100%); }
    body.night.raining { background: linear-gradient(180deg, #0b0f17 0%, #1c2535 60%, #273140 100%); }
    #canvas-container { width: 100%; height: 100%; position: fixed; inset: 0; touch-action: none; }

    .hud-top {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .hud-row { display: flex; flex-wrap: wrap; gap: 7px; pointer-events: auto; }
    /* 不用 backdrop-filter：舊 iPhone 疊在 WebGL 上會掉幀 */
    .hud-btn {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.9rem; font-weight: 600; color: #2c3e50;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      cursor: pointer; transition: transform 0.1s;
    }
    .hud-btn:active { transform: scale(0.95); }
    .hud-btn.active { background: #2ecc71; color: #fff; border-color: #27ae60; }
    .hud-record { text-decoration: none; background: #f39c12; color: #fff; border-color: #e67e22; }

    .hud-bottom {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      background: rgba(15, 23, 42, 0.72); color: #fff;
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem;
      max-width: 92vw; text-align: center;
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.45);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      background: #fff; border-radius: 18px; padding: 24px 20px;
      width: 100%; max-width: 340px; text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }
    .modal-card h3 { margin: 0 0 8px; color: #2c3e50; font-size: 1.25rem; }
    .modal-card p {
      margin: 0 0 18px; color: #555; line-height: 1.6; font-size: 1rem;
      white-space: pre-line; max-height: 50vh; overflow-y: auto;
    }
    .modal-close {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: #2ecc71; color: #fff; font-size: 1.05rem; font-weight: bold; cursor: pointer;
    }

    #gal-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 8px; }
    .gal-tab {
      border: none; border-radius: 12px; padding: 9px 2px; background: #eef3f6;
      font-family: inherit; font-size: 0.92rem; font-weight: 700; color: #4a5a68; cursor: pointer;
    }
    .gal-tab.active { background: #2ecc71; color: #fff; }
    #gal-count { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 8px; }
    #gal-body { max-height: 52vh; overflow-y: auto; margin-bottom: 14px; }
    .achv-img { width: 54px; height: 54px; object-fit: contain; image-rendering: pixelated; }
    .achv-img.sil { filter: brightness(0); opacity: 0.32; }   /* 還沒解鎖：只看得到剪影 */

    /* 長按 1 秒的圈圈 */
    #press-ring {
      position: fixed; z-index: 30; width: 74px; height: 74px; margin: -37px 0 0 -37px;
      pointer-events: none; display: none;
    }
    #press-ring.show { display: block; }
    #press-ring circle { fill: rgba(255,255,255,0.25); stroke: #fff; stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 200; stroke-dashoffset: 200; transform: rotate(-90deg); transform-origin: 50% 50%;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
    #press-ring.show circle { animation: press-fill 0.8s linear forwards; }
    @keyframes press-fill { to { stroke-dashoffset: 0; } }
    .achv-sub { font-size: 0.72rem; color: #95a5a6; margin-top: 2px; }
    .achv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .achv-cell {
      border: 2px solid #e6eef2; background: #f7fbfd; border-radius: 14px;
      padding: 10px 4px; cursor: pointer; font-family: inherit;
    }
    .achv-cell.locked { background: #eceff1; border-color: #dfe3e6; }
    .achv-icon { font-size: 2rem; line-height: 1.2; }
    .achv-name { font-size: 0.85rem; font-weight: 600; color: #34495e; margin-top: 4px; }
    .achv-cell.locked .achv-name { color: #95a5a6; letter-spacing: 2px; }

    #debug-panel {
      display: none; position: fixed; right: 10px; bottom: 60px; z-index: 20;
      background: rgba(0, 0, 0, 0.7); color: #9fffa8; font: 12px/1.5 monospace;
      padding: 6px 10px; border-radius: 8px; pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-top">
    <!-- 島嶼按鈕由 js/island/config.js 自動產生 -->
    <div class="hud-row" id="view-row"></div>
    <div class="hud-row">
      <!-- 記錄頁（原本的 2.5D 花園）：記錄、月曆、血壓血糖表都在那裡 -->
      <a class="hud-btn hud-record" href="record.html">📝 記錄</a>
      <button class="hud-btn" id="btn-time">🌙 夜晚</button>
      <button class="hud-btn" id="btn-rain">🌧️ 下雨</button>
      <!-- 測試用：模擬媽媽記一筆、模擬過了半夜 -->
      <button class="hud-btn demo-only" id="btn-record" style="display:none">📝 記一筆 (<span id="record-count">0</span>)</button>
      <button class="hud-btn demo-only" id="btn-nextday" style="display:none">⏭ 過一天</button>
      <button class="hud-btn" id="btn-gallery">📖 圖鑑</button>
      <button class="hud-btn" id="btn-quality">⚡ 省電</button>
    </div>
  </div>

  <div class="hud-bottom" id="status-tip">載入群島中...</div>
  <svg id="press-ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="31" /></svg>
  <div id="debug-panel"></div>

  <div class="modal-backdrop" id="info-modal">
    <div class="modal-card">
      <div id="modal-icon" style="font-size: 2.8rem; margin-bottom: 6px;">🌸</div>
      <h3 id="modal-title">標題</h3>
      <p id="modal-desc">內容說明</p>
      <button class="modal-close" id="modal-close-btn">返回群島</button>
    </div>
  </div>

  <!-- 📖 圖鑑：花／寵物／魚／裝飾品（分頁在 js/island/gallery.js 的 GALLERY_TABS） -->
  <div class="modal-backdrop" id="gal-modal">
    <div class="modal-card" style="max-width: 400px;">
      <h3>📖 圖鑑</h3>
      <div id="gal-tabs"></div>
      <div id="gal-count"></div>
      <div id="gal-body"></div>
      <button class="modal-close" id="gal-close">返回群島</button>
    </div>
  </div>

  <!-- 🔑 花園通行碼（跟主程式同一組，輸入過一次就不會再出現） -->
  <div class="modal-backdrop" id="key-modal">
    <div class="modal-card">
      <div style="font-size: 2.8rem; margin-bottom: 6px;">🔑</div>
      <h3>請輸入花園通行碼</h3>
      <p id="key-msg" style="color:#e67e22; margin-bottom: 10px;"></p>
      <input id="key-input" type="password" autocomplete="off"
        style="width:100%; padding:13px; font-size:1.1rem; border:2px solid #ddd; border-radius:12px; margin-bottom:14px; user-select:text; -webkit-user-select:text;" />
      <button class="modal-close" id="key-submit">進入花園</button>
    </div>
  </div>

  <!-- 與主程式共用：通行碼、n8n 網址、進度同步、紀錄規則、40 種花的資料 -->
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data-flowers.js"></script>
  <script src="js/data-pets.js"></script>
  <script src="js/data-fish.js"></script>
  <script src="js/data-decor.js"></script>
  <script src="js/data-quotes.js"></script>
  <script src="js/flower-seeds.js"></script>
  <script src="js/weather.js"></script>   <!-- 只用裡面的 WEATHER_URL（跟主程式同一個天氣來源） -->
  <script type="module" src="js/island/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
