<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>媽媽的健康日記 V2 (2.5D 遊戲版)</title>


    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121418">
    <meta name="apple-mobile-web-app-title" content="健康日記">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* =========================================
           亮色系主題變數 (Light Mode)
           ========================================= */
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.85); /* 半透明白底毛玻璃 */
            --text-color: #2c3e50; /* 深藍灰，閱讀舒適不刺眼 */
            --text-muted: #7f8c8d;
            --primary: #00bcd4; /* 更適合白底的亮藍色 */
            --primary-glow: rgba(0, 188, 212, 0.4);
            --accent: #2980b9; 
            --danger: #e74c3c;
            --warning: #f39c12;
            --border: rgba(0, 0, 0, 0.08); /* 非常淡的淺灰邊框 */
            
            --tag-food: #7ab1e0;
            --tag-status: #e3b341;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 鎖定主畫面，避免任何滑動 */
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; touch-action: none; }

        /* =========================================
           1. 2.5D 等距視角 (Isometric) 復古農場
           ========================================= */
        #garden-world {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; display: flex; flex-direction: column; overflow: hidden;
            background-color: #000; /* 移除原本寫死的淺藍色 */
        }
        
        /* 天空層改為 100% 高度，作為整個世界真正的底色 */
        #garden-sky {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            transition: background 2s; z-index: 1;
        }
        /* 調整漸層比例，上半部是天空，下半部是純色底色 */
        .sky-day { background: linear-gradient(to bottom, #74c7ff 0%, #c8ebff 40%, #c8ebff 100%); }
        .sky-night { background: linear-gradient(to bottom, #101828 0%, #1a2a42 40%, #1a2a42 100%); }
        
        .celestial-body {
            position: absolute; top: 8%; right: 25%; font-size: 3.5rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
            animation: floatUp 4s ease-in-out infinite alternate; z-index: 2;
        }
        
        .star { position: absolute; color: #FFF; font-size: 0.8rem; animation: twinkle 2s infinite alternate; z-index: 1; }

        /* =========================================
           動畫關鍵影格 (修復星星與月亮不動的問題)
           ========================================= */
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.05); } /* 增加移動幅度 */
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .celestial-body {
            position: absolute; 
            top: 5%;  /* ⬅️ 調整這裡：數字越小，月亮越高 (原本是 8%) */
            left: 8%; /* ⬅️ 調整這裡：數字越小，月亮越靠左 (原本是 12%) */
            font-size: 3.5rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
            animation: floatUp 3s ease-in-out infinite alternate; z-index: 2;
        }
        
        .star { 
            position: absolute; color: #FFF; font-size: 1rem; 
            animation: twinkle 1.5s ease-in-out infinite alternate; z-index: 1; 
        }

        /* =========================================
           夜空流星特效 (修正直線物理與空中燃盡)
           ========================================= */
        @keyframes shootAcross {
            /* 透過 translateX 讓流星沿著自身旋轉的角度「直直往前衝」 */
            0% { transform: rotate(var(--star-angle, 20deg)) translateX(-10vw) scale(0.5); opacity: 0; }
            2% { opacity: 1; transform: rotate(var(--star-angle, 20deg)) translateX(0vw) scale(1); } 
            /* 12% 時(約3秒)提早燃燒殆盡，確保不會接觸到草地 */
            12% { transform: rotate(var(--star-angle, 20deg)) translateX(60vw) scale(0.2); opacity: 0; } 
            100% { transform: rotate(var(--star-angle, 20deg)) translateX(60vw); opacity: 0; } 
        }
        
        .shooting-star {
            position: absolute;
            /* 起點改由變數控制，不再用動畫改變 top/left */
            left: var(--star-start-x, 0%);
            top: var(--star-start-y, 0%);
            width: 100px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
            border-radius: 50%;
            filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px rgba(0, 229, 255, 0.5)); 
            animation: shootAcross 25s infinite linear;
            z-index: 1; /* 保持在天空底層 */
            opacity: 0; /* 🌟 關鍵修復：預設為隱形，避免在動畫延遲(等待發射)期間露出原形 🌟 */
        }


        /* =========================================
           天空飄雲特效 (日夜皆有)
           ========================================= */
        @keyframes floatCloud {
            0% { transform: translateX(120vw); }
            100% { transform: translateX(-30vw); }
        }
        
        .cloud {
            position: absolute;
            filter: drop-shadow(0 5px 15px rgba(255,255,255,0.4));
            animation: floatCloud linear infinite;
            z-index: 3; 
            opacity: 0.85;
        }

        /* =========================================
           即時天氣系統 (雨天特效)
           ========================================= */
        #weather-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 15; 
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.6));
            width: 2px; height: 35px; 
            border-radius: 2px;
            animation: rainFall linear infinite;
            opacity: 0; /* 🌟 關鍵修復：預設為隱形，避免一開始卡在畫面上方 🌟 */
        }

        @keyframes rainFall {
            0% { transform: translateY(-50px) rotate(15deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            /* 加深 Y 軸掉落距離，確保完整穿透畫面底部 */
            100% { transform: translateY(120vh) translateX(-30vh) rotate(15deg); opacity: 0; }
        }


        

        /* =========================================
           微風擺動動畫 (減速 50%)
           ========================================= */
        @keyframes windBreeze {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        .swaying-plant {
            display: inline-block; 
            /* 🌟 將動畫時間從 3.5s 延長到 7.0s (速度變慢 50%) 🌟 */
            animation: windBreeze 7s ease-in-out infinite; 
            transform-origin: bottom center; 
        }


        /* =========================================
           原野微風與昆蟲飛行特效
           ========================================= */

        /* 昆蟲飛行軌跡 */
        @keyframes flyAcross {
            0% { left: -10%; margin-top: 0px; }
            25% { margin-top: -30px; }
            50% { margin-top: 20px; }
            75% { margin-top: -20px; }
            100% { left: 110%; margin-top: 0px; }
        }
        @keyframes flyAcrossReverse {
            0% { left: 110%; margin-top: 0px; }
            25% { margin-top: 25px; }
            50% { margin-top: -20px; }
            75% { margin-top: 30px; }
            100% { left: -10%; margin-top: 0px; }
        }

        /* 昆蟲共用樣式 (星星的一半大小 = 0.5rem) */
        .flying-insect {
            position: absolute;
            font-size: 0.5rem; 
            z-index: 60; /* 確保飛在草地與花朵上方 */
            filter: drop-shadow(0 15px 5px rgba(0,0,0,0.3)); /* 距離地面很高的陰影 */
            animation: flyAcross 20s linear infinite;
        }
        /* 向左飛行的獨立屬性 */
        .fly-reverse {
            animation: flyAcrossReverse 25s linear infinite;
            transform: scaleX(-1); /* 把圖案水平翻轉 */
        }



        /* =========================================
           地平線與天空比例調整 (恢復寬闊透視，大樹回歸)
           ========================================= */
        #garden-floor-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1200px; overflow: hidden; z-index: 10;
            /* 🌟 恢復為 100%，讓草地邊緣自然淡出，大樹就不會被切掉了 🌟 */
            -webkit-mask-image: radial-gradient(ellipse 150% 120% at 50% 115%, black 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 150% 120% at 50% 115%, black 55%, transparent 100%);
        }

        /* 草地與網格 */
        #garden-floor {
            /* 🌟將 top 從 0% 改為 -15%，讓整片草地往上移，成功減少天空面積🌟 */
            position: absolute; top: -15%; left: -40%; width: 180%; height: 160%;
            border-radius: 45%; 
            background-color: #8cc474; 
            background-image: 
                linear-gradient(rgba(255,255,255,0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 2px, transparent 2px),
                radial-gradient(circle at 10px 10px, rgba(0,0,0,0.03) 2px, transparent 3px);
            background-size: 8% 8%, 8% 8%, 30px 30px;
            transform: rotateX(60deg) rotateZ(45deg);
            transform-style: preserve-3d;
        }

        /* 中間 4 格專用的「肥沃泥土」 */
        .farm-plot {
            position: absolute; width: 8.2%; height: 8.2%; 
            background-color: #795548; border: 2px solid #5D4037; box-sizing: border-box;
            border-radius: 4px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        /* 植物站直與陰影 */
        .garden-item {
            position: absolute; transform: rotateZ(-45deg) rotateX(-60deg);
            transform-origin: bottom center; 
            /* 🌟 將原本生硬且偏移的長陰影，改為正下方極柔和的接地陰影 🌟 */
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15)) contrast(1.1);
            display: flex; justify-content: center; align-items: flex-end; image-rendering: pixelated;
        }
        
        /* 小草直接移除陰影，讓草地畫面保持清爽乾淨 */
        .grass-tuft { font-size: 1.2rem; opacity: 0.7; filter: none; }
        
        /* 左側大樹固定位 */
        .big-tree-25d {
            font-size: 7rem;
            transform: rotateZ(-45deg) rotateX(-60deg);
            /* 🌟 大樹陰影也改為正下方柔和擴散，消除原本的銳利黑影 🌟 */
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
        }

        /* =========================================
           2. 遊戲主 UI (右側飄浮按鈕 - 升級高質感毛玻璃)
           ========================================= */
        .game-sidebar {
            /* 稍微往左邊靠一點，留出安全邊距 */
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 20;
        }
        
        .game-btn {
            /* 稍微放大一點點，增加點擊的舒適度 */
            width: 64px; height: 64px; border-radius: 50%;
            
            /* 🌟 高質感毛玻璃背景 (透出背後的天空與天氣) 🌟 */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* 支援 iOS */
            
            /* 🌟 3D 立體光影與極細邊框 🌟 */
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 8px 16px rgba(0, 0, 0, 0.2),              /* 底部懸浮陰影 */
                inset 0 4px 5px rgba(255, 255, 255, 0.5),   /* 頂部內發光 (立體凸起) */
                inset 0 -4px 5px rgba(0, 0, 0, 0.05);       /* 底部內陰影 */
                
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; cursor: pointer; 
            
            /* 加入一點 Q 彈的動畫曲線，讓互動更有遊戲感 */
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        
        /* 滑鼠懸停 (如果是用電腦版測試時會看到) */
        .game-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
        
        /* 點擊壓下的 Q 彈回饋 */
        .game-btn:active { 
            transform: scale(0.92); 
            box-shadow: 
                0 3px 6px rgba(0, 0, 0, 0.3), 
                inset 0 2px 5px rgba(0, 0, 0, 0.2); 
        }

        /* =========================================
           3. 各功能視窗 (高質感亮色毛玻璃)
           ========================================= */
        .overlay-page {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            /* 🌟 白色的毛玻璃遮罩，透出背後的花園 🌟 */
            background: rgba(255,255,255,0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 40; display: none; overflow-y: auto; padding: 20px; padding-bottom: 80px;
            -webkit-overflow-scrolling: touch;
        }
        .overlay-page.active { display: block; }
        
        /* 視窗頂部返回鍵 */
        .back-to-game-btn {
            position: sticky; top: 0; z-index: 50; display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255, 255, 255, 0.9); color: var(--danger); border: 1px solid rgba(231, 76, 60, 0.3);
            padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; margin-bottom: 20px;
        }

        /* 視窗共用區塊設計 */
        .section-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--accent); font-weight: bold; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        /* 🌟 新增 3 欄式網格，給飲食與喝水專用 🌟 */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .grid-full { grid-column: span 2; } 
        /* 🌟 按鈕整體縮小約 30% (padding 與字體調小) 🌟 */
        button.record-btn { background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border); border-radius: 12px; padding: 14px 5px; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        /* 🌟 內部 Emoji 圖示也等比例縮小 🌟 */
        .icon { font-size: 1.5rem; margin-bottom: 5px; }

        /* 盆栽畫面 (配合亮色系調整配色) */
        .game-container { text-align: center; background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .pot-scene { position: relative; width: 100%; height: 220px; background: linear-gradient(to bottom, #a1dffb, #e6f7ff 50%, #a2d28f 50%, #68a34f 100%); border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1); }
        .soil-patch { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 40px; background: #795548; border-radius: 50%; box-shadow: inset 0 5px 10px rgba(0,0,0,0.4); }
        .plant-avatar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 5rem; animation: breath 3s infinite ease-in-out; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        @keyframes breath { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05) translateY(-5px); } }
        .progress-bar { width: 100%; height: 20px; background: rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid var(--border); }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00bcd4, #3498db); transition: width 0.5s; }
        .stage-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

        /* 行事曆 (版面修正 - 亮色版) */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; color: var(--text-color); font-size: 1.2rem; font-weight: bold; background: var(--panel-bg); border-radius: 12px 12px 0 0; }
        .calendar-nav-btn { background: transparent; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 10px; background: var(--panel-bg); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 10px 20px 10px; background: var(--panel-bg); border-radius: 0 0 12px 12px; }
        .day-cell { min-height: 70px; background: rgba(0, 0, 0, 0.03); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; align-items: center; padding-top: 6px; color: var(--text-color); cursor: pointer; }
        .day-cell.today { background: rgba(0, 188, 212, 0.1); border: 1px solid var(--primary); font-weight: bold; }
        .day-cell.empty { background: transparent; border: none; }
        .record-icons { display: flex; gap: 2px; margin-top: auto; padding-bottom: 5px; flex-wrap: wrap; justify-content: center; font-size: 0.8rem; }
        
        
        /* =========================================
           4. 內部小彈窗 (新增紀錄、明細) - 亮色版
           ========================================= */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--bg-color); padding: 20px; border-radius: 16px; width: 92%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { font-size: 1.2rem; color: var(--accent); font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .time-picker, .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text-color); font-size: 1.1rem; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); }
        .time-selector { display: none; gap: 8px; margin-bottom: 15px; }
        .time-btn { flex: 1; padding: 10px 0; background: #fff; border: 1px solid var(--border); color: var(--text-color); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .time-btn.selected { background: var(--primary); color: #fff; font-weight: bold; border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
        .submit-btn { background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; box-shadow: 0 4px 10px var(--primary-glow); }
        .close-btn { background: #fff; color: var(--text-muted); border: 1px solid var(--border); padding: 12px; border-radius: 8px; }

        /* 歷史明細 */
        .history-container { margin-bottom: 15px; display: none; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; border-left: 3px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .edit-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
        .detail-group { background: #fff; border-radius: 8px; margin-bottom: 12px; padding: 12px; border-left: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .detail-group.danger { border-left-color: var(--danger); }
        .detail-group.warning { border-left-color: var(--warning); }
        .detail-time-title { font-size: 0.9rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .detail-group.danger .detail-time-title { color: var(--danger); }
        .detail-group.warning .detail-time-title { color: var(--warning); }
        .detail-item { font-size: 0.95rem; margin: 8px 0 0 0; color: var(--text-color); display: flex; justify-content: space-between; align-items: flex-start; }
        .detail-item span.tag { font-size: 0.75rem; background: #f0f4f8; padding: 3px 8px; border-radius: 6px; color: var(--text-muted); margin-left: 10px; white-space: nowrap;}
        /* 🌟 防止連續點擊時出現反白與陰影 (樹木與農田隱藏按鈕專用) 🌟 */

    <script>
        // API 連結
        const N8N_GET_URL = 'https://orthodox-oarfish.pikapod.net/webhook/get-health-records';
        const N8N_POST_URL = 'https://orthodox-oarfish.pikapod.net/webhook/health-record';

        let currentRecordType = ''; let currentInputCategory = ''; let selectedTimePeriod = ''; let editingRecordId = null; 
        let currentDate = new Date(); let recordsDB = {};
        // 🌟 新增變數：記憶現在是要記錄哪一天 (預設為今天) 🌟
        let targetRecordDate = getFormattedDate(new Date());

        // 🌟 新增變數：記憶目前生長區的所有植物年紀，以及現在正查看到第幾株 🌟
        let activeGrowingAges = [];
        let currentViewingIndex = 0;

        const startYear = 2026;
        
        // 替換為全數帶有莖葉、樹幹或盆底的植物，確保立體落地感
        // 嚴選 5 種「自帶莖葉」的純花朵，打亂交錯排列以增加花園豐富度
        // 🌟 移除了會平貼在地上的蓮花(🪷)，嚴格保留這 4 種帶有莖葉的立體花朵 🌟
        const fiveYearPlants = [
            '🌻', '🌷', '🌹', '🪻',
            '🌷', '🪻', '🌻', '🌹',
            '🌹', '🌻', '🪻', '🌷',
            '🪻', '🌹', '🌻', '🌷'
        ];
        function getFormattedDate(dateObj) { return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`; }

        // --- 真實月相運算 (依據新月週期 29.530588天) ---
        function getRealMoonPhase(date) {
            let year = date.getFullYear(); let month = date.getMonth() + 1; let day = date.getDate();
            if (month < 3) { year--; month += 12; } ++month;
            let jd = 365.25 * year + 30.6 * month + day - 694039.09; // 距公元 2000年已知新月的日數
            let phase = jd / 29.5305882;
            let cycle = phase - Math.floor(phase); // 取得 0.0 ~ 0.999 的週期比例
            
            if (cycle < 0.05) return '🌑';      // 新月
            else if (cycle < 0.2) return '🌒'; // 眉月
            else if (cycle < 0.3) return '🌓'; // 上弦月
            else if (cycle < 0.45) return '🌔';// 盈凸月
            else if (cycle < 0.55) return '🌕';// 滿月
            else if (cycle < 0.7) return '🌖'; // 虧凸月
            else if (cycle < 0.8) return '🌗'; // 下弦月
            else if (cycle < 0.95) return '🌘';// 殘月
            return '🌑';
        }

        async function sendErrorLog(errorMsg) {
            const now = new Date();
            const payload = { date: getFormattedDate(now), time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'), period: '', type: '系統報錯', content: errorMsg, category: 'error' };
            try { await fetch(N8N_POST_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); } catch(e) {}
        }

        async function loadData() {
            try {
                const response = await fetch(N8N_GET_URL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("網路回應異常");
                const data = await response.json();
                recordsDB = {};
                data.forEach(item => {
                    const cleanDate = item.date.substring(0, 10);
                    if(!recordsDB[cleanDate]) recordsDB[cleanDate] = [];
                    recordsDB[cleanDate].push(item);
                });
                
                updateGardenLandscape25D(); // 渲染 2.5D 花園主畫面
                updatePlantLogic();
                renderCalendar();
            } catch (error) { sendErrorLog(`讀取失敗: ${error.message}`); }
        }

        // --- 視窗開關邏輯 ---
        function openOverlay(pageId) { document.getElementById(pageId).classList.add('active'); }
        function closeOverlay(pageId) { document.getElementById(pageId).classList.remove('active'); }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        // 🌟 新增：開啟紀錄選單，並自動更新標題上的日期 🌟
        function openRecordPage(dateStr) {
            // 如果有傳入日期就用該日期，否則預設為今天
            targetRecordDate = dateStr || getFormattedDate(new Date());
            const displayDate = targetRecordDate === getFormattedDate(new Date()) ? '今日' : targetRecordDate;
            
            document.getElementById('record-page-title-food').innerText = `🍽️ 飲食紀錄 (${displayDate})`;
            document.getElementById('record-page-title-med').innerText = `🏥 醫療與身體狀況 (${displayDate})`;
            
            openOverlay('page-record');
        }
        
        
        // 點擊黑底關閉內部小彈窗
        document.getElementById('input-modal').addEventListener('click', function(e) { if(e.target===this) this.style.display='none'; });
        document.getElementById('detail-modal').addEventListener('click', function(e) { if(e.target===this) this.style.display='none'; });



        function updateGardenLandscape25D() {
            // =================================================================
            // 🌟🌟🌟 全新：高頻互動的即時生長與 24 小時凋零系統 🌟🌟🌟
            // =================================================================
            const now = new Date();
            let allRecords = [];
            // 將所有歷史紀錄轉換為精確的 Date 物件，並丟進一個大陣列
            Object.keys(recordsDB).forEach(date => {
                recordsDB[date].forEach(r => {
                    let dt = new Date(`${date}T${r.time}:00`);
                    // 🌟 嚴格過濾異常日期：排除 2026 年以前或未來的錯誤資料，保護花園不被異常凋零清空 🌟
                    if (!isNaN(dt.getTime()) && dt.getFullYear() >= 2026 && dt <= now) {
                        allRecords.push(dt);
                    }
                });
            });
            allRecords.sort((a, b) => a - b); // 依時間舊到新排序

            let gardenFlowerCount = 4; // 初始設定：花園自帶 4 朵花
            let growingPlants = []; // 正在中央生長區的植物階段紀錄
            
            if (allRecords.length > 0) {
                // 計算凋零機制 (從使用者的第一筆紀錄開始算，每滿 24 小時扣 2 朵)
                const firstRecordTime = allRecords[0];
                const elapsedHoursTotal = (now - firstRecordTime) / (1000 * 60 * 60);
                const decayCount = Math.floor(elapsedHoursTotal / 24) * 2;

                allRecords.forEach(recordTime => {
                    const ageInHours = (now - recordTime) / (1000 * 60 * 60);
                    if (ageInHours >= 8) {
                        // 超過 8 小時，植物已成熟並離開生長區，移盆進入外圍花園
                        gardenFlowerCount++;
                    } else if (ageInHours >= 0) {
                        // 還在 8 小時內，留在中間 4 格生長區
                        let stage = '🌰'; // 0~2小時: 種子
                        if (ageInHours >= 6) stage = fiveYearPlants[Math.floor(Math.random() * fiveYearPlants.length)]; // 6~8小時: 開花
                        else if (ageInHours >= 4) stage = '🌿'; // 4~6小時: 長葉
                        else if (ageInHours >= 2) stage = '🌱'; // 2~4小時: 發芽
                        growingPlants.push(stage);
                    }
                });
                // 扣除長期凋零數量 (確保底線為 0 朵，不會變負數)
                gardenFlowerCount = Math.max(0, gardenFlowerCount - decayCount);

                // =========================================
                // 🌟 測試用：強制塞滿 192 朵花，模擬第一、二圈全滿狀態 🌟
                // (測試完排版後，請將下面這一行刪除或加上 // 註解)
                //gardenFlowerCount = 192;
                // =========================================

            }

            // 準備放入外圍花園的花朵陣列
            const collectedPlants = [];
            for(let i = 0; i < gardenFlowerCount; i++) {
                collectedPlants.push(fiveYearPlants[i % fiveYearPlants.length]);
            }
            
            // 🌟 生長區擴充：最多顯示 16 株 (4格 * 每格 2x2 = 16) 🌟
            const displayGrowings = growingPlants.slice(-16);
            
            // =========================================
            // 🌟 測試用：強制塞滿 16 株不同階段的植物來看排版 🌟
            // (確認排列整齊、大小滿意後，請將下面這一行刪除或加上 // 註解)
            //const displayGrowings = ['🌰','🌱','🌿','🌷', '🌰','🌱','🌿','🌻', '🌰','🌱','🌿','🌹', '🌰','🌱','🌿','🪻'];
            // =========================================

            // 只需要定義 4 塊農田的基底座標
            const farmTiles = [ {x:5, y:5}, {x:6, y:5}, {x:5, y:6}, {x:6, y:6} ];
            
            // 🌟 終極微調：往左移一點 (減少 dx)，讓 4 株植物達到完美的九宮格置中 🌟
            const growOffsets = [
                {dx: 2.2, dy: 0.6}, {dx: 4.8, dy: 0.6},
                {dx: 2.2, dy: 3.2}, {dx: 4.8, dy: 3.2}
            ];

            // 1. 渲染天空與月相
            const sky = document.getElementById('garden-sky');
            sky.innerHTML = '';
            const hour = now.getHours();
            const isDay = hour >= 6 && hour < 18;
            sky.className = isDay ? 'sky-day' : 'sky-night';
            
            const celestial = document.createElement('div');
            celestial.className = 'celestial-body';
            celestial.innerText = isDay ? '☀️' : getRealMoonPhase(now);
            sky.appendChild(celestial);

            for(let i=0; i<4; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.innerText = '☁️';
                cloud.style.top = (2 + Math.random() * 13) + '%';
                cloud.style.fontSize = (2.5 + Math.random() * 2.5) + 'rem';
                if (!isDay) cloud.style.opacity = '0.5';
                cloud.style.animationDuration = (40 + Math.random() * 40) + 's';
                cloud.style.animationDelay = '-' + (Math.random() * 60) + 's';
                sky.appendChild(cloud);
            }

            if (!isDay) {
                for(let i=0; i<12; i++) {
                    const star = document.createElement('div');
                    star.className = 'star'; star.innerText = '✨';
                    star.style.top = (2 + Math.random()*23) + '%';
                    star.style.left = (5 + Math.random()*90) + '%';
                    star.style.animationDelay = (Math.random()*2) + 's';
                    sky.appendChild(star);
                }
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                function resetShootingStar() {
                    const startX = -5 + Math.random() * 25; 
                    const startY = -5 + Math.random() * 15; 
                    const angle = 15 + Math.random() * 20;
                    shootingStar.style.setProperty('--star-start-x', startX + '%');
                    shootingStar.style.setProperty('--star-start-y', startY + '%');
                    shootingStar.style.setProperty('--star-angle', angle + 'deg');
                }
                resetShootingStar();
                shootingStar.style.animationDelay = (Math.random() * 10) + 's';
                shootingStar.addEventListener('animationiteration', resetShootingStar);
                sky.appendChild(shootingStar);
            }

            // 2. 渲染地面與大樹
            const floor = document.getElementById('garden-floor');
            if(!document.getElementById('garden-floor-wrapper')) {
                const wrapper = document.createElement('div');
                wrapper.id = 'garden-floor-wrapper';
                floor.parentNode.insertBefore(wrapper, floor);
                wrapper.appendChild(floor);
            }
            floor.innerHTML = '';
            
            const bigTree = document.createElement('div');
            bigTree.className = 'garden-item big-tree-25d';
            bigTree.innerHTML = '<span>🌳</span>';
            bigTree.style.left = '15%'; 
            bigTree.style.top = '40%';  
            bigTree.style.zIndex = Math.floor(40 * 100 + 15); 

            // =========================================
            // 🌟 隱藏彩蛋：連續點擊大樹 5 次強制更新系統 🌟
            // =========================================
            let treeClickCount = 0;
            let treeClickTimer = null;
            
            bigTree.onclick = () => {
                treeClickCount++;
                clearTimeout(treeClickTimer); // 重置計時器
                
                if (treeClickCount >= 5) {
                    //alert("🌳 系統更新精靈：正在為您重新載入最新版本...");
                    window.location.href = window.location.pathname + '?v=' + new Date().getTime();
                } else {
                    // 如果 2 秒內沒有繼續連點，就歸零重新計算 (避免平時誤觸累積)
                    treeClickTimer = setTimeout(() => { 
                        treeClickCount = 0; 
                    }, 2000);
                }
            };

            floor.appendChild(bigTree);

            // 3. 準備花圈空位與防重疊
            const occupiedPoints = [];
            occupiedPoints.push({x: 15, y: 40}); 
            
            const flowerOffsets = [
                {dx: 2.4, dy: 0.2}, {dx: 5.6, dy: 0.2},
                {dx: 2.4, dy: 2.6}, {dx: 5.6, dy: 2.6},
                {dx: 2.4, dy: 5.0}, {dx: 5.6, dy: 5.0}
            ];
            let availableFlowerSpots = [];
            
            for (let r = 1; r <= 6; r++) {
                let ringTiles = [];
                let min = 5 - r;
                let max = 6 + r;
                for (let rx = min; rx <= max; rx++) {
                    for (let ry = min; ry <= max; ry++) {
                        if (rx === min || rx === max || ry === min || ry === max) {
                            ringTiles.push({x: rx, y: ry});
                        }
                    }
                }
                ringTiles.sort(() => Math.random() - 0.5); 
                
                let ringSpots = [];
                ringTiles.forEach(t => {
                    flowerOffsets.forEach(off => {
                        ringSpots.push({
                            left: t.x * 8 + off.dx + (Math.random() - 0.5),
                            top: t.y * 8 + off.dy + (Math.random() - 0.5)
                        });
                    });
                });
                ringSpots.sort(() => Math.random() - 0.5); 
                availableFlowerSpots.push(...ringSpots);
            }

            // 將外圍花園的花朵種入空位 (已移除舊版月份擴增的錯誤迴圈)
            collectedPlants.forEach((flower) => {
                if (availableFlowerSpots.length === 0) return;
                
                const spot = availableFlowerSpots.shift(); 
                occupiedPoints.push({x: spot.left, y: spot.top});
                
                const pastPlant = document.createElement('div');
                pastPlant.className = 'garden-item';
                const delay = (Math.random() * -7).toFixed(2);
                pastPlant.innerHTML = `<span class="swaying-plant" style="animation-delay: ${delay}s">${flower}</span>`;
                pastPlant.style.left = spot.left + '%';
                pastPlant.style.top = spot.top + '%';
                pastPlant.style.fontSize = (1.0 + Math.random() * 0.3) + 'rem';
                pastPlant.style.zIndex = Math.floor(spot.top * 100 + spot.left); 
                floor.appendChild(pastPlant);
            });

            // 1. 先把 4 塊深色泥土底板畫好
            farmTiles.forEach(t => {
                const soil = document.createElement('div');
                soil.className = 'farm-plot';
                soil.style.left = (t.x * 8) + '%';
                soil.style.top = (t.y * 8) + '%';
                soil.onclick = () => openOverlay('page-plant'); // 🌟 生長區點擊隱藏按鈕 🌟
                floor.appendChild(soil);
            });

            // 2. 🌟 關鍵修正：將植物「平均分散」種植到 4 塊地，避免同一塊地擠滿 4 株大葉子 🌟
            displayGrowings.forEach((stage, index) => {
                const tileIndex = index % 4; // 取餘數：0, 1, 2, 3 (輪流分配給 4 塊農田)
                const offsetIndex = Math.floor(index / 4); // 除以4：0, 1, 2, 3 (決定種在農田的哪個角落)

                const t = farmTiles[tileIndex];
                const off = growOffsets[offsetIndex];

                const plantX = t.x * 8 + off.dx;
                const plantY = t.y * 8 + off.dy;
                occupiedPoints.push({x: plantX, y: plantY});

                const plant = document.createElement('div');
                plant.className = 'garden-item';
                plant.onclick = () => openOverlay('page-plant'); // 🌟 植物點擊隱藏按鈕 🌟
                const delay = (Math.random() * -7).toFixed(2);
                plant.innerHTML = `<span class="swaying-plant" style="animation-delay: ${delay}s">${stage}</span>`;
                plant.style.left = plantX + '%';
                plant.style.top = plantY + '%';
                
                // 動態依照生長階段設定大小
                let size = '1.4rem'; 
                if (stage === '🌰') size = '0.55rem';      
                else if (stage === '🌱') size = '0.85rem'; 
                else if (stage === '🌿') size = '1.15rem'; 
                
                plant.style.fontSize = size; 
                plant.style.zIndex = Math.floor(plantY * 100 + plantX);
                floor.appendChild(plant);
            });

            // ... (下面保留原本的 "// 4. 隨機撒上小草裝飾" 不動)

            // 4. 隨機撒上小草裝飾 (雷達防重疊機制)
            for(let i=0; i<135; i++) {
                let gx, gy, isOverlapping;
                let attempts = 0; 
                do {
                    gx = 15 + Math.random() * 70; 
                    gy = 15 + Math.random() * 70;
                    isOverlapping = false;
                    
                    if (gx >= 38 && gx <= 58 && gy >= 38 && gy <= 58) {
                        isOverlapping = true;
                        continue;
                    }
                    
                    for (let pt of occupiedPoints) {
                        let dist = Math.sqrt(Math.pow(gx - pt.x, 2) + Math.pow(gy - pt.y, 2));
                        if (dist < 3.5) { 
                            isOverlapping = true;
                            break;
                        }
                    }
                    attempts++;
                } while (isOverlapping && attempts < 50); 

                if (isOverlapping) continue;

                const grass = document.createElement('div');
                grass.className = 'garden-item';
                const delay = (Math.random() * -7).toFixed(2);
                grass.innerHTML = `<span class="swaying-plant" style="animation-delay: ${delay}s">🌿</span>`; 
                grass.style.left = gx + '%';
                grass.style.top = gy + '%';
                grass.style.fontSize = (0.7 + Math.random() * 0.5) + 'rem';
                grass.style.zIndex = Math.floor(gy * 100 + gx);
                floor.appendChild(grass);
            }

            // 5. 加入 2隻蜜蜂 與 2隻蝴蝶
            const wrapper = document.getElementById('garden-floor-wrapper');
            // 清除之前的昆蟲避免重複疊加
            wrapper.querySelectorAll('.flying-insect').forEach(el => el.remove());

            const bugs = ['🐝', '🦋', '🐝', '🦋'];
            bugs.forEach((bug, index) => {
                const insect = document.createElement('div');
                insect.innerText = bug;
                // 一半往右飛，一半往左飛
                insect.className = index % 2 === 0 ? 'flying-insect' : 'flying-insect fly-reverse';
                
                // 讓牠們隨機分布在畫面中下方的高度
                insect.style.top = (40 + Math.random() * 40) + '%';
                // 打亂牠們出現的時間，才不會並排一起飛
                insect.style.animationDelay = '-' + (Math.random() * 20) + 's';
                
                wrapper.appendChild(insect);
            });
        }

        function updatePlantLogic() {
            const now = new Date();
            let allRecords = [];
            Object.keys(recordsDB).forEach(date => {
                recordsDB[date].forEach(r => {
                    let dt = new Date(`${date}T${r.time}:00`);
                    // 🌟 嚴格過濾異常日期：排除 2026 年以前或未來的錯誤資料，保護花園不被異常凋零清空 🌟
                    if (!isNaN(dt.getTime()) && dt.getFullYear() >= 2026 && dt <= now) {
                        allRecords.push(dt);
                    }
                });
            });
            allRecords.sort((a, b) => a - b);
            
            let gardenCount = 4;
            activeGrowingAges = []; // 每次更新時清空陣列
            
            if (allRecords.length > 0) {
                const first = allRecords[0];
                const decay = Math.floor((now - first) / (1000*60*60*24)) * 2;
                let harvested = 0;
                
                allRecords.forEach(t => {
                    const age = (now - t) / (1000*60*60);
                    if(age >= 8) {
                        harvested++;
                    } else if (age >= 0) {
                        // 🌟 將所有 8 小時內的生長中植物，全部收錄到陣列裡 🌟
                        activeGrowingAges.push(age);
                    }
                });
                gardenCount = Math.max(0, 4 + harvested - decay);
            }
            
            // 排序：讓年紀最小(最新)的排在最前面
            activeGrowingAges.sort((a, b) => a - b);
            
            document.getElementById('garden-total-flowers').innerText = gardenCount;
            
            // 每次打開視窗都從最新的一株開始看
            currentViewingIndex = 0;
            renderCurrentPlantStatus();
        }

        // 🌟 新增：負責渲染「當下正在查看的那株植物」的 UI 🌟
        function renderCurrentPlantStatus() {
            const avatar = document.getElementById('plant-avatar');
            const text = document.getElementById('plant-stage-text');
            const pBar = document.getElementById('game-progress');
            const hint = document.getElementById('cycle-hint');
            
            if (activeGrowingAges.length === 0) {
                avatar.innerText = '💤';
                text.innerText = "生長區目前休息中 (新增紀錄來種下種子！)";
                pBar.style.width = '0%';
                if(hint) hint.style.display = 'none';
            } else {
                const age = activeGrowingAges[currentViewingIndex];
                let percent = Math.min((age / 8) * 100, 100);
                pBar.style.width = `${percent}%`;
                
                // 在標題後方加上 (目前株數/總株數)
                const countLabel = `(${currentViewingIndex + 1}/${activeGrowingAges.length})`;
                
                if (age >= 6) { avatar.innerText = '🌷'; text.innerText = `階段 4: 準備移盆的開花 ${countLabel}`; }
                else if (age >= 4) { avatar.innerText = '🌿'; text.innerText = `階段 3: 茂盛的綠葉 ${countLabel}`; }
                else if (age >= 2) { avatar.innerText = '🌱'; text.innerText = `階段 2: 努力發芽中 ${countLabel}`; }
                else { avatar.innerText = '🌰'; text.innerText = `階段 1: 剛種下的種子 ${countLabel}`; }
                
                // 如果有超過一株植物，就顯示提示文字
                if(hint) hint.style.display = activeGrowingAges.length > 1 ? 'block' : 'none';
            }
        }

        // 🌟 新增：點擊盆栽時觸發的切換邏輯 🌟

            if (activeGrowingAges.length > 1) {
                // 索引值 +1，如果到底了就回到 0 (形成無限迴圈)
                currentViewingIndex = (currentViewingIndex + 1) % activeGrowingAges.length;

                avatar.style.animation = 'none';

            }
        }

        // --- 實況天氣系統 (台灣高雄市仁武區) ---
        async function checkRealtimeWeather() {
            try {
                // 呼叫 Open-Meteo API (仁武區經緯度: 22.70, 120.35)
                const weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=22.70&longitude=120.35&current=weather_code&timezone=Asia%2FTaipei';
                const response = await fetch(weatherUrl);
                const data = await response.json();
                
                // WMO 國際天氣代碼：50 以上通常包含毛毛雨、陣雨、暴雨或雷雨
                const weatherCode = data.current.weather_code;
                const isRaining = weatherCode >= 50 && weatherCode <= 99;

                // =========================================
                // 🌟 模擬測試用：強迫下雨 🌟
                // (測試完畢後，把下一行刪除或註解，就會恢復真實天氣)
                //const isRaining = true; 
                // =========================================

                if (isRaining) {
                    startRainEffect();
                }
            } catch (error) {
                console.log("氣象資料讀取失敗，保持晴天", error);
            }
        }

            for (let i = 0; i < 160; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                
                drop.style.left = (-20 + Math.random() * 170) + '%'; 
                drop.style.top = (Math.random() * -50) + 'px';

                drop.style.animationDelay = (Math.random() * 2) + 's';
                
                weatherLayer.appendChild(drop);

        }

        updateBgmBtnUI();

        // 當音樂讀取到長度資訊後，隨機跳轉到一個時間點作為開頭
        bgm.addEventListener('loadedmetadata', () => { bgm.currentTime = Math.random() * bgm.duration; });

        function updateBgmBtnUI() {
            const btn = document.getElementById('bgm-toggle-btn');
            if (btn) btn.innerText = bgmEnabled ? '🎵' : '🔇';
        }

        function toggleBgm() {
            bgmEnabled = !bgmEnabled;
            localStorage.setItem('bgm_enabled', bgmEnabled);
            updateBgmBtnUI();
            
            if (bgmEnabled) {
                bgm.play().catch(err => console.log("等待互動"));
            } else {
                bgm.pause();
            }
        }
        
        // 如果使用者上次離開時是打開的，一載入畫面就嘗試播放
        if (bgmEnabled) {
            bgm.play().catch(err => {
                document.body.addEventListener('click', () => { if(bgmEnabled) bgm.play(); }, { once: true });
            });
        }

        // 在啟動時除了讀取資料，也同步檢查天氣
        checkRealtimeWeather();

        loadData();

        // 在啟動時除了讀取資料，也同步檢查天氣
        checkRealtimeWeather();


        loadData();
    </script>

    <div id="success-modal" class="modal">
        <div class="modal-content" style="text-align: center; padding: 30px 20px;">
            <h2 style="color: var(--primary); margin-top: 0;">🎉 紀錄成功！</h2>
            <p id="success-message" style="color: var(--text-color); font-size: 1.05rem; margin: 15px 0; line-height: 1.5;"></p>
            <div class="seed-animation">🌰</div>
            <p style="color: var(--accent); font-size: 1.1rem; font-weight: bold;">你獲得了一顆新種子！</p>
            <button class="submit-btn" onclick="closeModal('success-modal')" style="margin-top: 20px; width: 100%;">太棒了</button>
        </div>
    </div>

</body>
